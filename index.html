<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVision | Cuestionario de Salud Visual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>
    <div class="bg-orb orb-c" aria-hidden="true"></div>

    <main class="layout">
      <header class="hero glass">
        <p class="badge">MVision</p>
        <h1>Cuestionario inteligente de salud visual</h1>
        <p class="hero-text">
          Plataforma desarrollada por <strong>Marián Martínez Marín</strong>. MVision es una iniciativa
          gratuita e intuitiva que, mediante un cuestionario, ofrece sugerencias sobre tu salud visual.
        </p>
      </header>

      <form id="mvision-form" class="questionnaire glass" novalidate>
        <div class="stepper-head">
          <p id="step-indicator" class="step-indicator">Paso 1 de 1</p>
          <div class="step-progress" aria-hidden="true">
            <span id="step-progress-bar"></span>
          </div>
        </div>

        <div id="form-content"></div>

        <footer class="form-footer">
          <div class="nav-buttons">
            <button type="button" id="prev-btn" class="nav-btn" aria-label="Paso anterior">←</button>
            <button type="button" id="next-btn" class="nav-btn" aria-label="Siguiente paso">→</button>
          </div>
          <p id="status-message" class="status" aria-live="polite"></p>
          <button type="submit" id="submit-btn" class="submit-btn">Enviar cuestionario</button>
        </footer>
      </form>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
